[build]
  publish = "site"
  command = ""
  # Nightly house updates are served from GitHub, so they must not trigger a (paid) Netlify deploy.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)site/houses' ':(exclude)site/img' ':(exclude)data'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[[headers]]
  for = "/houses/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[redirects]]
  from = "/ie"
  to = "/#ie"
  status = 302

[[redirects]]
  from = "/uk"
  to = "/#uk"
  status = 302
