[build]
  publish = "site"
  command = ""
  # Only changes to the game itself (site/ pages, functions, this file) cost a Netlify deploy.
  # Houses, photos, jokes (data/), the picker (scripts/) and the GitHub workflow never do.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)site/houses' ':(exclude)site/img' ':(exclude)data' ':(exclude)scripts' ':(exclude).github' ':(exclude)README.md'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[[headers]]
  for = "/houses/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[redirects]]
  from = "/ie"
  to = "/#ie"
  status = 302

[[redirects]]
  from = "/uk"
  to = "/#uk"
  status = 302

# Private league invites: guesstheask.com/l/ABC234
[[redirects]]
  from = "/l/:code"
  to = "/?league=:code"
  status = 302
