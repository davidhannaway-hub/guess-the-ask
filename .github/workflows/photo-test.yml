name: Photo test
# Runs the front-of-house photo check over recent game photos and known bad ones. Changes nothing.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - uses: actions/cache@v4
        with:
          path: .cache/hf
          key: hf-clip-vit-base-patch32-v1
      - run: >
          node scripts/photo-test.mjs
          site/img/usc-nyc/2026-11-18-3248583316.jpg
          $(ls site/img/ier/*-2.jpg site/img/ier/*-3.jpg | head -20)
