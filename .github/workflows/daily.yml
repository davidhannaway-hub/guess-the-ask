name: Daily houses

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC every night
  workflow_dispatch:
    inputs:
      force_refill:
        description: "Pull fresh listings from Apify even if the pool is full"
        type: boolean
        default: false
      country:
        description: "ie, uk or both"
        default: "both"

permissions:
  contents: write

concurrency:
  group: daily-houses
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pick today's houses
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.force_refill }}" = "true" ]; then ARGS="$ARGS --force-refill"; fi
          if [ -n "${{ inputs.country }}" ] && [ "${{ inputs.country }}" != "both" ]; then ARGS="$ARGS --country ${{ inputs.country }}"; fi
          node scripts/daily.mjs $ARGS
      - name: Save
        if: always()
        run: |
          git config user.name "guess-the-ask-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site data
          git diff --cached --quiet || git commit -m "Houses for $(date -u +%F)"
          git push
