name: Daily houses

on:
  schedule:
    # GitHub silently drops scheduled runs sometimes, so there are backup slots.
    # The picker skips if today's houses already exist, so extra runs are harmless.
    - cron: "17 0 * * *"   # 00:17 UTC
    - cron: "47 1 * * *"   # 01:47 UTC
    - cron: "17 3 * * *"   # 03:17 UTC
    - cron: "47 4 * * *"   # 04:47 UTC
  push:
    paths: ["data/run-now.txt"]   # edit this file to run the job straight away
  workflow_dispatch:
    inputs:
      force_refill:
        description: "Pull fresh listings from Apify even if the pool is full"
        type: boolean
        default: false
      country:
        description: "ie, uk or both"
        default: "both"

permissions:
  contents: write

concurrency:
  group: daily-houses
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # A bad token must not stop the game: the picker can still use the saved pool
      # (about a week of houses). We only warn here, and fail the run at the very end,
      # after today's houses are saved, so GitHub still emails about it.
      - name: Check the Apify token
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.apify.com/v2/users/me?token=$APIFY_TOKEN")
          echo "Apify token check: HTTP $code" | tee data/token-check.log
          if [ "$code" != "200" ]; then
            echo "::warning::APIFY_TOKEN is missing or invalid (HTTP $code). Using the saved pool today."
            touch /tmp/token-bad
          fi
      - name: Remember today's live houses
        run: |
          mkdir -p /tmp/live
          for c in ie uk; do cp "site/houses/$c/latest.json" "/tmp/live/$c.json" 2>/dev/null || true; done
      - name: Pick today's houses
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.force_refill }}" = "true" ]; then ARGS="$ARGS --force-refill"; fi
          if [ -n "${{ inputs.country }}" ] && [ "${{ inputs.country }}" != "both" ]; then ARGS="$ARGS --country ${{ inputs.country }}"; fi
          set -o pipefail
          node scripts/daily.mjs $ARGS 2>&1 | tee data/last-run.log
      - name: "Guard: today's live houses must not change"
        if: always()
        run: |
          today=$(TZ=Europe/London date +%F)
          for c in ie uk; do
            [ -f "/tmp/live/$c.json" ] || continue
            was=$(node -e "console.log(require('/tmp/live/$c.json').date)")
            if [ "$was" = "$today" ] && [ "${{ inputs.force_refill }}" != "true" ] && ! cmp -s "/tmp/live/$c.json" "site/houses/$c/latest.json"; then
              echo "::error::Today's $c houses were about to change mid-day. Putting them back and failing the run."
              cp "/tmp/live/$c.json" "site/houses/$c/latest.json"; cp "/tmp/live/$c.json" "site/houses/$c/$today.json"
              git checkout -- data/ || true
              echo "BLOCKED" > /tmp/blocked
            fi
          done
          [ ! -f /tmp/blocked ] || exit 1
      - name: Save
        if: always()
        run: |
          git config user.name "guess-the-ask-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site data
          git diff --cached --quiet || git commit -m "Houses for $(date -u +%F)"
          git pull --rebase --autostash || true
          git push
      - name: Flag a bad Apify token
        if: always()
        run: |
          if [ -f /tmp/token-bad ]; then
            echo "::error::Today's houses were picked from the saved pool, but APIFY_TOKEN is invalid. Fix it before the pool runs out."
            exit 1
          fi
