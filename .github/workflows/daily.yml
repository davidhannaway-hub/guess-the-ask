name: Daily houses

on:
  schedule:
    # GitHub silently drops scheduled runs sometimes, so there are backup slots.
    # The picker skips if today's houses already exist, so extra runs are harmless.
    - cron: "17 0 * * *"   # 00:17 UTC
    - cron: "47 1 * * *"   # 01:47 UTC
    - cron: "17 3 * * *"   # 03:17 UTC
    - cron: "47 4 * * *"   # 04:47 UTC
  push:
    paths: ["data/run-now.txt"]   # edit this file to run the job straight away
  workflow_dispatch:
    inputs:
      force_refill:
        description: "Pull fresh listings from Apify even if the pool is full"
        type: boolean
        default: false
      country:
        description: "ie, uk, nl (Netherlands), us, ier (Irish rentals), ukr (UK rentals), usr (US rentals) or both (both = every game)"
        default: "both"
      refill_only:
        description: "Only top up the pool from Apify (no games built): for small deliberate pulls"
        type: boolean
        default: false
      vary:
        description: "Make today's and the next two days' city games more varied (swaps up to two houses per game; may change today's live game)"
        type: boolean
        default: false
      swap:
        description: "Apply data/swap-plan.json: targeted swaps in today's city game (may change today's live game)"
        type: boolean
        default: false
      fix_photos:
        description: "Re-check the photos in today's and the next two days' games and fix any that don't show the front of the house (may change today's game)"
        type: boolean
        default: false
      ahead_only:
        description: "With fix_photos: leave today's live games alone, fix only tomorrow and the day after"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-houses
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # onnxruntime-node (used by the photo check) otherwise tries to download CUDA GPU binaries,
      # which 404s and fails the whole run; the photo check only needs the CPU build
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      # the exterior-photo check (scripts/exterior.mjs) downloads a CLIP model once; keep it cached
      - uses: actions/cache@v4
        with:
          path: .cache/hf
          key: hf-clip-vit-base-patch32-v1
      # A bad token must not stop the game: the picker can still use the saved pool
      # (about a week of houses). We only warn here, and fail the run at the very end,
      # after today's houses are saved, so GitHub still emails about it.
      - name: Check the Apify token
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.apify.com/v2/users/me?token=$APIFY_TOKEN")
          echo "Apify token check: HTTP $code" | tee data/token-check.log
          if [ "$code" != "200" ]; then
            echo "::warning::APIFY_TOKEN is missing or invalid (HTTP $code). Using the saved pool today."
            touch /tmp/token-bad
          fi
      - name: Remember today's live houses
        run: |
          mkdir -p /tmp/live
          for c in ie uk nl us ier ukr usr usc-nyc usc-sf usc-chicago usc-seattle usc-boston; do cp "site/houses/$c/latest.json" "/tmp/live/$c.json" 2>/dev/null || true; done
      - name: Pick today's houses
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.force_refill }}" = "true" ]; then ARGS="$ARGS --force-refill"; fi
          if [ "${{ inputs.fix_photos }}" = "true" ]; then ARGS="$ARGS --fix-photos"; fi
          if [ "${{ inputs.ahead_only }}" = "true" ]; then ARGS="$ARGS --ahead-only"; fi
          if [ "${{ inputs.vary }}" = "true" ]; then ARGS="$ARGS --vary"; fi
          if [ "${{ inputs.swap }}" = "true" ]; then ARGS="$ARGS --swap"; fi
          if [ "${{ inputs.refill_only }}" = "true" ]; then ARGS="$ARGS --refill-only"; fi
          if [ -n "${{ inputs.country }}" ] && [ "${{ inputs.country }}" != "both" ]; then ARGS="$ARGS --country ${{ inputs.country }}"; fi
          set -o pipefail
          node scripts/daily.mjs $ARGS 2>&1 | tee data/last-run.log
      - name: "Guard: today's live houses must not change"
        # a photo fix is the one deliberate exception: it may swap a photo or a house in today's game
        if: always() && inputs.fix_photos != true && inputs.vary != true && inputs.swap != true
        run: |
          for c in ie uk nl us ier ukr usr usc-nyc usc-sf usc-chicago usc-seattle usc-boston; do
            # each country's "today" is on its own clock
            case $c in usc-sf|usc-seattle) tz=America/Los_Angeles;; usc-chicago) tz=America/Chicago;; us|usr|usc-*) tz=America/New_York;; nl) tz=Europe/Amsterdam;; *) tz=Europe/London;; esac
            today=$(TZ=$tz date +%F)
            [ -f "/tmp/live/$c.json" ] || continue
            was=$(node -e "console.log(require('/tmp/live/$c.json').date)")
            if [ "$was" = "$today" ] && ! cmp -s "/tmp/live/$c.json" "site/houses/$c/latest.json"; then
              echo "::error::Today's $c houses were about to change mid-day. Putting them back and failing the run."
              cp "/tmp/live/$c.json" "site/houses/$c/latest.json"; cp "/tmp/live/$c.json" "site/houses/$c/$today.json"
              git checkout -- data/ || true
              echo "BLOCKED" > /tmp/blocked
            fi
          done
          [ ! -f /tmp/blocked ] || exit 1
      - name: Save
        if: always()
        run: |
          git config user.name "guess-the-ask-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site data
          git diff --cached --quiet || git commit -m "${{ inputs.fix_photos && 'Fix house photos' || 'Houses for' }} $(date -u +%F)"
          git pull --rebase --autostash || true
          # big pushes (lots of photos) sometimes drop mid-upload, and a dropped push can still land.
          # Retry on HTTP/1.1, then judge by what's actually on GitHub: fail only if this run's work is missing.
          git config http.version HTTP/1.1
          git config http.postBuffer 524288000
          for i in 1 2 3 4 5; do
            git -c http.version=HTTP/1.1 push && break
            sleep $((i * 10)); git pull --rebase --autostash || true
          done
          git fetch -q origin main || true
          if git merge-base --is-ancestor HEAD origin/main; then echo "Saved to GitHub."; else echo "::error::Couldn't save to GitHub after 5 tries."; exit 1; fi
      - name: "Check: no houses from blocked agents"
        # data/blocked-agents.json lists agents we must never use. Fails if a live or future game, or any pool, contains one.
        if: always() && inputs.fix_photos != true
        run: node scripts/check-blocked.mjs
      - name: "Check: three days of houses built in every game"
        # today and the next two days must exist for Ireland, the UK and every US city, or the run fails and GitHub emails
        if: always() && inputs.fix_photos != true && (inputs.country == '' || inputs.country == 'both')
        run: |
          bad=0
          for c in ie uk nl ier ukr usc-nyc usc-sf usc-chicago usc-seattle usc-boston; do
            case $c in usc-sf|usc-seattle) tz=America/Los_Angeles;; usc-chicago) tz=America/Chicago;; usc-*) tz=America/New_York;; nl) tz=Europe/Amsterdam;; *) tz=Europe/London;; esac
            for i in 0 1 2; do
              d=$(TZ=$tz date -d "+$i day" +%F)
              n=$(node -e "try{console.log(require('./site/houses/$c/$d.json').houses.length)}catch(e){console.log(0)}")
              if [ "$n" -lt 7 ]; then echo "::error::$c has no full game for $d (day +$i)"; bad=1; fi
            done
          done
          [ "$bad" = 0 ] || exit 1
      - name: Flag a bad Apify token
        if: always()
        run: |
          if [ -f /tmp/token-bad ]; then
            echo "::error::Today's houses were picked from the saved pool, but APIFY_TOKEN is invalid. Fix it before the pool runs out."
            exit 1
          fi
